name: Build iPad IPA
on:
  push:
    branches: ['codex/ipad-ipa']
    paths: ['ios/**', '.github/workflows/ios-ipad.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device IPA
        run: bash ios/scripts/build-unsigned.sh
      - name: Test on iPad Simulator
        run: bash ios/scripts/test-ipad.sh
      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Remote-iPad-unsigned
          path: ios/build/DSH-Remote-iPad-unsigned.ipa
          if-no-files-found: ignore
      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPad-validation
          path: |
            ios/build/*.log
            ios/build/*.xcresult
            ios/build/screenshots/