name: Build iPad IPA
on:
  push:
    branches: ['codex/mobile-releases', 'main']
    paths: ['apps/ios/**', 'src/**', 'lib/**', 'scripts/test-apns.mjs', 'package.json', '.github/workflows/ios-ipad.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate plugin artifacts and APNs
        run: |
          node scripts/verify-artifacts.mjs
          npm run test:apns
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device IPA
        run: bash apps/ios/scripts/build-unsigned.sh
      - name: Test on iPad Simulator
        run: bash apps/ios/scripts/test-ipad.sh
      - name: Upload unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Remote-iPad-unsigned
          path: release/DSH-Remote-iPad-unsigned.ipa
          if-no-files-found: error
      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPad-validation
          path: |
            apps/ios/build/*.log
            apps/ios/build/*.xcresult
            apps/ios/build/screenshots/