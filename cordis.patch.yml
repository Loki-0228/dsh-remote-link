# One package, one plugin row, two faces. Install it into a dsh profile:
#
#   dsh plugin --profile web add D:\dsh-web-exe\dsh-remote-link
#
# The patch layer below inserts the single row that mounts BOTH halves: the
# host side (pairing tokens, device sessions, /api/pair routes, the gated
# /remote channel, the SakuraFrp tunnel) and the browser side (the modules
# node half scans `dsh.client` packages into the web plugin roster, served
# from this package's lib/client.js).

- insert:
    - id: remote-link
      name: '@loki-0228/dsh-remote-link'
